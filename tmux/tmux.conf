# ~/.tmux.conf  — Catppuccin Mocha, vim-friendly, працює з tmux 3.0+
# Перезавантажити:  prefix + r

# ─── Базове ──────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix               # C-a C-a → передати C-a в програму (початок рядка в bash)

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10             # без затримки Esc у nvim
set -g focus-events on
set -g display-time 2000
set -g repeat-time 600
setw -g aggressive-resize on
set -g set-titles on
set -g set-titles-string "#h › #S › #W"
setw -g automatic-rename on
setw -g mode-keys vi
set -g status-keys emacs

# ─── Кольори / термінал ──────────────────────────────────────────────────────
# tmux-256color, якщо є terminfo; інакше screen-256color (старі сервери)
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc,alacritty:Tc,xterm-kitty:Tc,wezterm:Tc"
# Буфер обміну через OSC 52 → копіювання з tmux/nvim на сервері потрапляє у твій локальний буфер
set -g set-clipboard on
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'
# Підкреслення-хвильки (undercurl) для діагностики nvim
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
# Дозволити nvim/програмам передавати escape-послідовності (tmux 3.3+)
if-shell 'tmux -V | awk "{split(\$2,v,\".\"); exit !(v[1]*100+v[2] >= 303)}"' \
  'set -g allow-passthrough on'

# ─── Клавіші ─────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Спліти та нові вікна — в поточній директорії
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Панелі: prefix + h/j/k/l, розмір: prefix + H/J/K/L (можна тиснути повторно)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z

# Вікна: Alt+1..9 без префікса, Shift+←/→ — попереднє/наступне
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n S-Left previous-window
bind -n S-Right next-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind Tab last-window

# Синхронне введення в усі панелі вікна (зручно для кількох серверів одразу)
bind S setw synchronize-panes \; display "synchronize-panes: #{?pane_synchronized,ON,OFF}"

# Сесії
bind N new-session
bind s choose-tree -sZ -O name
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# Copy mode у стилі vim: prefix + [  → v (виділити), y (копіювати), Esc (вийти)
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# ─── Ctrl+h/j/k/l: навігація між панелями tmux і вікнами nvim ──────────────
# (в nvim це забезпечує плагін vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# Ctrl+l більше не чистить екран — тому: prefix + C-l
bind C-l send-keys C-l

# ─── Оформлення: Catppuccin Mocha ────────────────────────────────────────────
# base #1e1e2e  mantle #181825  crust #11111b  surface0 #313244  surface1 #45475a
# overlay0 #6c7086  text #cdd6f4  subtext0 #a6adc8  blue #89b4fa  mauve #cba6f7
# green #a6e3a1  peach #fab387  red #f38ba8  yellow #f9e2af  teal #94e2d5
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80

# Ліва частина: сесія (колір змінюється, коли натиснуто prefix / увімкнено sync)
set -g status-left "#[fg=#11111b,bold]#{?client_prefix,#[bg=#f38ba8],#{?pane_synchronized,#[bg=#fab387],#[bg=#cba6f7]}} #S #[bg=#181825] "

# Вікна
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#a6adc8,bg=#181825] #I #[fg=#6c7086]#W#{?window_zoomed_flag, [Z],} "
setw -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I #[fg=#cdd6f4,bg=#313244,nobold] #W#{?window_zoomed_flag, [Z],} "
setw -g window-status-activity-style "fg=#f9e2af,bg=#181825"
setw -g window-status-bell-style "fg=#f38ba8,bg=#181825"

# Права частина: хост (щоб завжди знати, де ти), дата/час
set -g status-right "#[fg=#a6adc8,bg=#181825]#{?client_prefix,#[fg=#f38ba8]PREFIX ,}#{?pane_in_mode,#[fg=#f9e2af]COPY ,}#[fg=#11111b,bg=#a6e3a1,bold] #h #[fg=#cdd6f4,bg=#313244,nobold] %d.%m %H:%M "

# Панелі
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
if-shell 'tmux -V | awk "{split(\$2,v,\".\"); exit !(v[1]*100+v[2] >= 302)}"' \
  'set -g pane-border-lines single'
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#89b4fa"

# Повідомлення / режими
set -g message-style "fg=#cdd6f4,bg=#313244,bold"
set -g message-command-style "fg=#89b4fa,bg=#313244"
setw -g mode-style "fg=#11111b,bg=#f9e2af"
setw -g clock-mode-colour "#89b4fa"

# ─── Плагіни (TPM) ───────────────────────────────────────────────────────────
# prefix + I — встановити, prefix + U — оновити
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix + C-s зберегти, prefix + C-r відновити
set -g @plugin 'tmux-plugins/tmux-continuum'   # автозбереження кожні 15 хв
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh psql mysql sqlite3 "~nvim" "~less" "~tail" "~htop" "~btop" "~watch"'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'                  # відновити сесії після перезапуску сервера tmux

# Локальні перевизначення (не в git): ~/.tmux.local.conf
if-shell '[ -f ~/.tmux.local.conf ]' 'source-file ~/.tmux.local.conf'

if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run -b ~/.tmux/plugins/tpm/tpm'
